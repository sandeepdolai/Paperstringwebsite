<body>
<div id="app-root">
  <div class="app-shell" id="appShell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand"><span class="brand-mark" aria-hidden="true">PS</span><span>Paper String</span></div>
      <nav class="nav" id="globalNav">
        <button class="nav-button active" data-screen="home"><span class="icon" data-icon="home"></span><span>Home</span></button>
        <button class="nav-button" data-screen="projects"><span class="icon" data-icon="folder"></span><span>Projects</span></button>
        <button class="nav-button" data-screen="templates"><span class="icon" data-icon="grid"></span><span>Templates</span></button>
        <button class="nav-button" data-screen="settings"><span class="icon" data-icon="settings"></span><span>Settings</span></button>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-note">A focused creative workspace. Your artwork stays in the foreground.</div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-context"><div class="topbar-title" id="topbarTitle">Home</div><div class="topbar-subtle" id="topbarSubtle">Create, edit, save, export.</div></div>
        <div class="topbar-actions">
          <div class="topbar-editor-only">
            <button class="button icon-only ghost" id="editorUndo" aria-label="Undo"><span class="icon" data-icon="undo"></span></button>
            <button class="button icon-only ghost" id="editorRedo" aria-label="Redo"><span class="icon" data-icon="redo"></span></button>
            <span class="topbar-subtle" id="saveStatus"><span class="status-dot saved"></span><span class="save-label">Saved</span></span>
            <button class="button ghost" id="editorBack">Exit</button>
            <button class="button strong" id="exportButtonTop"><span class="icon" data-icon="export"></span>Export</button>
          </div>
        </div>
      </header>
      <div id="screenRoot"></div>
    </main>
  </div>
</div>

<template id="homeTemplate">
<section class="page">
  <div class="hero-grid">
    <div class="hero-panel">
      <div><div class="eyebrow">Creative workspace</div><h1>Make the work.<br>Keep it clear.</h1><p class="lede">Paper String is a focused browser editor for photos, graphics, and original compositions. Start from a blank canvas or continue where you left off.</p></div>
      <div class="hero-actions"><button class="button strong" id="homeCreate"><span class="icon" data-icon="plus"></span>Create Blank</button><button class="button" id="homeTemplates"><span class="icon" data-icon="grid"></span>Browse Templates</button><button class="button" id="homeContinue">Continue Project</button></div>
    </div>
    <div class="hero-aside"><div><div class="eyebrow">Core loop</div><div class="task-list"><div class="task-row"><span><b>01</b> Create</span><span>Blank or template</span></div><div class="task-row"><span><b>02</b> Edit</span><span>Layers and tools</span></div><div class="task-row"><span><b>03</b> Save</span><span>Clear state</span></div><div class="task-row"><span><b>04</b> Export</span><span>High quality</span></div></div></div><div style="color:var(--muted);font-size:11px;line-height:1.5;">Nothing public is required. Projects are private workspace objects.</div></div>
  </div>

function paintIcons(root){(root||document).querySelectorAll('[data-icon]').forEach(function(el){el.innerHTML=iconMap[el.getAttribute('data-icon')]||'';el.style.display='inline-flex';var s=el.querySelector('svg');if(s){s.setAttribute('width','100%');s.setAttribute('height','100%')}})}

function projectCards(list){return '<div class="project-grid">'+list.map(function(p){return '<article class="project-card"><div class="project-thumb"><div class="mini-canvas" aria-hidden="true"></div></div><div class="project-info"><div class="project-name">'+escapeHTML(p.name)+'</div><div class="project-meta">'+escapeHTML(p.width+' × '+p.height)+' · '+escapeHTML(String(p.pages||1))+' page'+(p.pages===1?'':'s')+'</div><div class="project-actions"><button class="button" data-open-project="'+escapeHTML(p.id)+'">Open</button><button class="button ghost" data-rename-project="'+escapeHTML(p.id)+'">Rename</button><button class="button ghost" data-duplicate-project="'+escapeHTML(p.id)+'">Duplicate</button><button class="button ghost danger" data-delete-project="'+escapeHTML(p.id)+'">Delete</button></div></div></article>'}).join('')+'</div>'}

function bindProjectCards(root){root.querySelectorAll('[data-open-project]').forEach(function(b){b.addEventListener('click',function(){var p=state.projects.find(function(x){return x.id===b.dataset.openProject});if(p)openProject(p)})});root.querySelectorAll('[data-rename-project]').forEach(function(b){b.addEventListener('click',function(){var p=state.projects.find(function(x){return x.id===b.dataset.renameProject});if(!p)return;var n=prompt('Project name',p.name);if(n&&n.trim()){p.name=n.trim();saveJSON('paper-string-projects',state.projects);renderScreen()}})});root.querySelectorAll('[data-delete-project]').forEach(function(b){b.addEventListener('click',function(){var p=state.projects.find(function(x){return x.id===b.dataset.deleteProject});if(!p)return;if(confirm('Delete "'+p.name+'" from this local workspace?')){state.projects=state.projects.filter(function(x){return x.id!==p.id});saveJSON('paper-string-projects',state.projects);renderScreen()}})});root.querySelectorAll('[data-duplicate-project]').forEach(function(b){b.addEventListener('click',function(){var p=state.projects.find(function(x){return x.id===b.dataset.duplicateProject});if(!p)return;var copy=Object.assign({},p,{id:uid('project'),name:p.name+' copy',updatedAt:new Date().toISOString()});state.projects.unshift(copy);saveJSON('paper-string-projects',state.projects);renderScreen()})})}

function showModal(content){var root=document.getElementById('modalRoot');root.hidden=false;root.innerHTML='<div class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal">'+content+'</div></div>';root.querySelector('.modal-backdrop').addEventListener('click',function(e){if(e.target===e.currentTarget)closeModal()});root.querySelectorAll('[data-close-modal]').forEach(function(b){b.addEventListener('click',closeModal)});paintIcons(root)}

function openCanvasModal(){showModal('<div class="modal-head"><div><div class="eyebrow">New project</div><h2>Set up your canvas</h2></div><button class="button icon-only ghost" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="form-grid"><div class="form-group"><label for="canvasName">Project name</label><input class="input" id="canvasName" value="Untitled Project"></div><div></div><div class="form-group"><label for="canvasWidth">Width</label><input class="input" id="canvasWidth" type="number" min="1" max="20000" value="1080"></div><div class="form-group"><label for="canvasHeight">Height</label><input class="input" id="canvasHeight" type="number" min="1" max="20000" value="1080"></div></div><div class="preset-row"><button class="preset" data-preset="1080x1080">1080 × 1080</button><button class="preset" data-preset="1920x1080">1920 × 1080</button><button class="preset" data-preset="1080x1920">1080 × 1920</button><button class="preset" data-preset="2400x1350">2400 × 1350</button><button class="preset" data-preset="731x1197">731 × 1197</button></div><div class="modal-note">Canvas size is independent from image resize, crop, and object transform. Presets are shortcuts only; any custom width and height is valid.</div></div><div class="modal-foot"><button class="button" data-close-modal>Cancel</button><button class="button strong" id="createCanvasConfirm">Create & edit</button></div>');document.querySelectorAll('[data-preset]').forEach(function(b){b.addEventListener('click',function(){var p=b.dataset.preset.split('x');document.getElementById('canvasWidth').value=p[0];document.getElementById('canvasHeight').value=p[1]})});document.getElementById('createCanvasConfirm').addEventListener('click',function(){var n=document.getElementById('canvasName').value.trim()||'Untitled Project',w=Math.max(1,Math.min(20000,parseInt(document.getElementById('canvasWidth').value||1080,10))),h=Math.max(1,Math.min(20000,parseInt(document.getElementById('canvasHeight').value||1080,10)));closeModal();createProject(n,w,h,'blank')})}
function openTemplatePreview(t){showModal('<div class="modal-head"><div><div class="eyebrow">Template placeholder</div><h2>'+escapeHTML(t.name)+'</h2></div><button class="button icon-only ghost" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="preview-layout"><div class="preview-art"><div class="poster"></div></div><div class="preview-copy"><h3>Starting composition</h3><p>This record is only for UX testing. The final Paper String template library will be supplied separately.</p><div class="meta-list"><div><span>Category</span><b>'+escapeHTML(t.category)+'</b></div><div><span>Canvas</span><b>'+escapeHTML(t.size)+'</b></div><div><span>State</span><b>Placeholder</b></div></div></div></div></div><div class="modal-foot"><button class="button" data-close-modal>Back</button><button class="button strong" id="selectTemplate">Select & edit</button></div>');document.getElementById('selectTemplate').addEventListener('click',function(){closeModal();var d=t.size.split('×').map(function(x){return parseInt(x.trim(),10)});createProject(t.name,d[0],d[1],'template')})}
function editorMarkup(){var defs=[['select','select','Select'],['move','move','Move'],['image','image','Image'],['type','type','Text'],['shape','shape','Shape'],['brush','brush','Brush'],['eraser','eraser','Eraser'],['crop','crop','Crop'],['selectArea','selectArea','Selection']],rail=defs.map(function(t,i){var div=(i===2||i===5||i===7)?'<div class="tool-divider"></div>':'';return div+'<button class="tool-button '+(state.activeTool===t[0]?'active':'')+'" data-tool="'+t[0]+'" aria-label="'+t[2]+'" title="'+t[2]+'"><span class="icon" data-icon="'+t[1]+'"></span></button>'}).join(''),thumbs='';for(var p=1;p<=state.pageCount;p++)thumbs+='<button class="page-thumb '+(state.page===p?'active':'')+'" data-page="'+p+'" aria-label="Canvas '+p+'"><span class="page-number">'+p+'</span></button>';return '<section class="editor" aria-label="Paper String editor"><aside class="tool-rail" aria-label="Editing tools">'+rail+'<div class="tool-spacer"></div><button class="tool-button '+(state.activeTool==='eraser'?'active':'')+'" data-tool="eraser" aria-label="Eraser" title="Eraser"><span class="icon" data-icon="eraser"></span></button></aside><div class="editor-stage"><div class="canvas-scroll"><div class="canvas-board" style="transform:scale('+(state.zoom/100)+')"><div class="art-block art-title">Make something worth keeping.</div><div class="art-block art-sub">A clean composition is often a better starting point than another layer of interface.</div><div class="art-block art-shape"></div><div class="art-block art-line"></div>'+((state.activeTool==='select'||state.activeTool==='move'||state.activeTool==='type')?'<div class="selection" aria-label="Selected object"><span class="handle tl"></span><span class="handle tr"></span><span class="handle bl"></span><span class="handle br"></span><span class="rotation-dot"></span></div>':'')+'</div><div class="zoom-label"><button id="zoomOut" aria-label="Zoom out"><span class="icon" data-icon="zoomOut"></span></button><span class="zoom-text">'+state.zoom+'%</span><button id="zoomIn" aria-label="Zoom in"><span class="icon" data-icon="zoomIn"></span></button></div></div><div class="page-strip"><button class="page-add" id="addPage" aria-label="Add canvas"><span class="icon" data-icon="plus"></span></button>'+thumbs+'<div class="page-nav-mobile"><button class="page-add" id="prevPage" aria-label="Previous canvas"><span class="icon" data-icon="chevronLeft"></span></button><span style="font:10px var(--mono);color:#999;">'+state.page+'/'+state.pageCount+'</span><button class="page-add" id="nextPage" aria-label="Next canvas"><span class="icon" data-icon="chevronRight"></span></button></div></div></div>'+inspectorMarkup()+'</section>'}
function inspectorMarkup(){if(state.inspectorTab==='layers')return layersMarkup();var t=state.activeTool,title=t==='eraser'?'Eraser':t==='brush'?'Brush':t==='type'?'Text':t==='shape'?'Shape':t==='image'?'Image':t==='crop'?'Crop':t==='selectArea'?'Selection':'Transform',body='';if(t==='brush'||t==='eraser'){body='<div class="panel-section"><div class="panel-title">'+title+' settings</div><div class="range-row"><div class="range-head"><span>Size</span><b id="sizeValue">'+state.brushSize+' px</b></div><input id="sizeSlider" type="range" min="1" max="240" value="'+state.brushSize+'"></div><div class="range-row"><div class="range-head"><span>Opacity</span><b id="opacityValue">'+state.opacity+'%</b></div><input id="opacitySlider" type="range" min="1" max="100" value="'+state.opacity+'"></div><div class="modal-note" style="margin-top:14px;background:#292929;color:#a8a8a2;">The '+title.toLowerCase()+' operates on the active layer. Undo and redo remain available from the editor header.</div></div>'}else if(t==='type'){body='<div class="panel-section"><div class="panel-title">Text</div><div class="control-row"><div class="field"><label>Size</label><input value="64"></div><div class="field"><label>Opacity</label><input value="100%"></div><div class="field full"><label>Font</label><input value="Paper String Sans"></div></div><div class="panel-buttons"><button class="editor-button">Color</button><button class="editor-button">Align</button></div></div>'}else if(t==='shape'){body='<div class="panel-section"><div class="panel-title">Shape</div><div class="control-row"><div class="field"><label>W</label><input value="320"></div><div class="field"><label>H</label><input value="460"></div><div class="field"><label>X</label><input value="800"></div><div class="field"><label>Y</label><input value="120"></div></div><div class="panel-buttons"><button class="editor-button">Fill</button><button class="editor-button">Stroke</button></div></div>'}else if(t==='image'){body='<div class="panel-section"><div class="panel-title">Image</div><div class="panel-buttons"><button class="editor-button primary" id="importImage"><span class="icon" data-icon="image"></span>Import image</button><button class="editor-button">Crop</button></div><div class="modal-note" style="margin-top:12px;background:#292929;color:#a8a8a2;">Large files, transparency, EXIF orientation and unsupported formats are explicit production states.</div></div>'}else if(t==='crop'){body='<div class="panel-section"><div class="panel-title">Crop</div><div class="control-row"><div class="field"><label>X</label><input value="0"></div><div class="field"><label>Y</label><input value="0"></div><div class="field"><label>W</label><input value="'+state.project.width+'"></div><div class="field"><label>H</label><input value="'+state.project.height+'"></div></div><div class="panel-buttons"><button class="editor-button">Cancel</button><button class="editor-button primary">Apply crop</button></div></div>'}else if(t==='selectArea'){body='<div class="panel-section"><div class="panel-title">Selection</div><p style="font-size:11px;color:#a8a8a2;line-height:1.5;">Selection defines an editing boundary for the active layer. It remains until changed, cleared, or applied.</p><div class="panel-buttons"><button class="editor-button">Invert</button><button class="editor-button">Clear</button></div></div>'}else{body='<div class="panel-section"><div class="panel-title">Transform</div><div class="control-row"><div class="field"><label>X</label><input value="86"></div><div class="field"><label>Y</label><input value="72"></div><div class="field"><label>W</label><input value="560"></div><div class="field"><label>H</label><input value="120"></div><div class="field full"><label>Rotation</label><input value="0°"></div></div><div class="panel-buttons"><button class="editor-button">Flip H</button><button class="editor-button">Flip V</button></div></div>'}return '<aside class="inspector" id="inspector"><div class="inspector-tabs"><button class="inspector-tab '+(state.inspectorTab==='inspect'?'active':'')+'" data-inspector="inspect">Inspect</button><button class="inspector-tab '+(state.inspectorTab==='layers'?'active':'')+'" data-inspector="layers">Layers</button><button class="inspector-tab" id="toggleInspector" aria-label="Toggle panel">⌃</button></div><div class="inspector-body"><div class="panel-section"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><div><div class="panel-title">Active object</div><div style="margin-top:4px;font-size:13px;font-weight:650;color:#fff;">'+escapeHTML(activeLayerName())+'</div></div><span style="font:10px var(--mono);color:#8f8f89;">PAGE '+state.page+'</span></div></div>'+body+'<div class="panel-section"><div class="panel-title">Object controls</div><div class="control-row"><div class="field"><label>X</label><input value="84"></div><div class="field"><label>Y</label><input value="70"></div><div class="field"><label>W</label><input value="560"></div><div class="field"><label>H</label><input value="126"></div></div></div></div></aside>'}
function layersMarkup(){return '<aside class="inspector" id="inspector"><div class="inspector-tabs"><button class="inspector-tab" data-inspector="inspect">Inspect</button><button class="inspector-tab active" data-inspector="layers">Layers</button><button class="inspector-tab" id="toggleInspector" aria-label="Toggle panel">⌃</button></div><div class="inspector-body"><div class="panel-section"><div class="panel-title">Layer stack</div><div class="layer-list">'+layers.map(function(l){return '<button class="layer-item '+(state.activeLayer===l.id?'active':'')+'" data-layer="'+l.id+'"><span class="icon" data-icon="'+(l.type==='text'?'type':l.type==='image'?'image':'shape')+'"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHTML(l.name)+'</span><span class="layer-actions"><span class="layer-action" data-layer-vis="'+l.id+'" aria-label="Toggle visibility"><span class="icon" data-icon="'+(l.visible?'eye':'eyeOff')+'"></span></span><span class="layer-action" data-layer-lock="'+l.id+'" aria-label="Toggle lock"><span class="icon" data-icon="'+(l.locked?'lock':'unlock')+'"></span></span></span></button>'}).join('')+'</div><div class="panel-buttons"><button class="editor-button" id="addTextLayer"><span class="icon" data-icon="type"></span>Add text</button><button class="editor-button" id="addShapeLayer"><span class="icon" data-icon="shape"></span>Add shape</button><button class="editor-button" id="duplicateLayer">Duplicate</button><button class="editor-button">Merge</button></div></div><div class="panel-section"><div class="panel-title">Layer rules</div><p style="font-size:11px;color:#a8a8a2;line-height:1.5;margin:8px 0 0;">Layer changes, transforms, drawing and destructive pixel operations participate in the same undo/redo history.</p></div></div></aside>'}
function activeLayerName(){var l=layers.find(function(x){return x.id===state.activeLayer});return l?l.name:'Selection'}
function bindEditor(){paintIcons(document.querySelector('.editor'));document.querySelectorAll('[data-tool]').forEach(function(b){b.addEventListener('click',function(){state.activeTool=b.dataset.tool;state.saveState='unsaved';renderScreen()})});document.querySelectorAll('[data-inspector]').forEach(function(b){b.addEventListener('click',function(){state.inspectorTab=b.dataset.inspector;renderScreen()})});document.getElementById('editorUndo').onclick=function(){setSaveStatusText('Undid last change')};document.getElementById('editorRedo').onclick=function(){setSaveStatusText('Redid change')};document.getElementById('editorBack').onclick=function(){saveProject();setScreen('home')};document.getElementById('exportButtonTop').onclick=openExportModal;document.getElementById('zoomIn').onclick=function(){state.zoom=Math.min(200,state.zoom+10);renderScreen()};document.getElementById('zoomOut').onclick=function(){state.zoom=Math.max(25,state.zoom-10);renderScreen()};document.querySelectorAll('[data-page]').forEach(function(b){b.addEventListener('click',function(){state.page=parseInt(b.dataset.page,10);renderScreen()})});document.getElementById('addPage').onclick=function(){state.pageCount+=1;state.page=state.pageCount;state.saveState='unsaved';renderScreen()};document.getElementById('prevPage').onclick=function(){state.page=Math.max(1,state.page-1);renderScreen()};document.getElementById('nextPage').onclick=function(){state.page=Math.min(state.pageCount,state.page+1);renderScreen()};var size=document.getElementById('sizeSlider');if(size)size.addEventListener('input',function(){state.brushSize=parseInt(size.value,10);document.getElementById('sizeValue').textContent=state.brushSize+' px'});var op=document.getElementById('opacitySlider');if(op)op.addEventListener('input',function(){state.opacity=parseInt(op.value,10);document.getElementById('opacityValue').textContent=state.opacity+'%'});document.querySelectorAll('[data-layer]').forEach(function(b){b.addEventListener('click',function(e){if(e.target.closest('[data-layer-vis]')||e.target.closest('[data-layer-lock]'))return;state.activeLayer=b.dataset.layer;state.inspectorTab='layers';renderScreen()})});document.querySelectorAll('[data-layer-vis]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var l=layers.find(function(x){return x.id===b.dataset.layerVis});if(l)l.visible=!l.visible;renderScreen()})});document.querySelectorAll('[data-layer-lock]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var l=layers.find(function(x){return x.id===b.dataset.layerLock});if(l)l.locked=!l.locked;renderScreen()})});var addT=document.getElementById('addTextLayer');if(addT)addT.onclick=function(){layers.unshift({id:uid('text'),type:'text',name:'New Text',visible:true,locked:false});state.activeLayer=layers[0].id;state.saveState='unsaved';renderScreen()};var addS=document.getElementById('addShapeLayer');if(addS)addS.onclick=function(){layers.unshift({id:uid('shape'),type:'shape',name:'New Shape',visible:true,locked:false});state.activeLayer=layers[0].id;state.saveState='unsaved';renderScreen()};var dup=document.getElementById('duplicateLayer');if(dup)dup.onclick=function(){var l=layers.find(function(x){return x.id===state.activeLayer});if(l){var c=Object.assign({},l,{id:uid(l.type),name:l.name+' copy'});layers.unshift(c);state.activeLayer=c.id;state.saveState='unsaved';renderScreen()}};var toggle=document.getElementById('toggleInspector');if(toggle)toggle.onclick=function(){var i=document.getElementById('inspector');if(i)i.classList.toggle('mobile-open')};var imp=document.getElementById('importImage');if(imp)imp.onclick=function(){showToast('Image import is represented here; decoding and format-specific states are part of the production implementation.')};var stage=document.querySelector('.canvas-scroll'),touchX=0;if(stage){stage.ontouchstart=function(e){if(e.touches.length===1)touchX=e.touches[0].clientX};stage.ontouchend=function(e){if(!touchX)return;var dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>56){if(dx<0)state.page=Math.min(state.pageCount,state.page+1);else state.page=Math.max(1,state.page-1);renderScreen()}touchX=0}}window.onkeydown=editorKeyHandler;updateSaveStatus()}
function editorKeyHandler(e){if(state.screen!=='editor')return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)document.getElementById('editorRedo').click();else document.getElementById('editorUndo').click()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveProject()}}
function saveProject(){if(!state.project)return;state.project.pages=state.pageCount;state.project.updatedAt=new Date().toISOString();state.projects=state.projects.map(function(p){return p.id===state.project.id?Object.assign({},p,state.project):p});saveJSON('paper-string-projects',state.projects);state.saveState='saved';updateSaveStatus();showToast('Saved')}
function updateSaveStatus(){var el=document.getElementById('saveStatus');if(!el)return;var label=state.saveState==='unsaved'?'Unsaved changes':state.saveState==='saving'?'Saving':'Saved';el.innerHTML='<span class="status-dot '+(state.saveState==='saved'?'saved':'')+'"></span><span class="save-label">'+label+'</span>'}
function setSaveStatusText(t){var el=document.getElementById('saveStatus');if(el)el.innerHTML='<span class="status-dot saved"></span><span class="save-label">'+escapeHTML(t)+'</span>';setTimeout(updateSaveStatus,1100)}
function openExportModal(){showModal('<div class="modal-head"><div><div class="eyebrow">Export</div><h2>Finish the canvas</h2></div><button class="button icon-only ghost" data-close-modal aria-label="Close">×</button></div><div class="modal-body"><div class="setting-row" style="padding-top:0;"><div><div class="setting-label">Pages</div><div class="setting-desc">Export the current canvas or every canvas in this project.</div></div><select class="input" style="width:165px;"><option>Current canvas</option><option>All canvases</option></select></div><div class="setting-row"><div><div class="setting-label">Format</div><div class="setting-desc">Transparent areas remain transparent where the selected format supports them.</div></div><span style="font-size:12px;color:var(--muted);">PNG</span></div><div class="modal-note">Paper String handles output quality automatically. There is no low / medium / high selector to make the user second-guess the result.</div></div><div class="modal-foot"><button class="button" data-close-modal>Cancel</button><button class="button strong" id="confirmExport"><span class="icon" data-icon="export"></span>Export</button></div>');document.getElementById('confirmExport').onclick=function(){closeModal();state.saveState='saved';updateSaveStatus();showToast('Export queued at high quality')}}
var toastTimer=null;function showToast(m){var old=document.getElementById('toast');if(old)old.remove();var t=document.createElement('div');t.id='toast';t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#171717;color:#fff;border:1px solid #333;padding:10px 13px;border-radius:8px;font-size:12px;z-index:100;box-shadow:0 12px 40px rgba(0,0,0,.24);';document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove()},1600)}
document.getElementById('globalNav').addEventListener('click',function(e){var b=e.target.closest('[data-screen]');if(b)setScreen(b.dataset.screen)});
renderScreen();paintIcons(document);
})();
